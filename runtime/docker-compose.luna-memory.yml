# Explicit opt-in; use together with docker-compose.yml. Never print rendered config.
services:
  graphiti-mcp:
    image: filomena-graphiti-mcp:luna-memory-candidate-20260928
    build:
      context: ../vendor/graphiti
      dockerfile: ../../runtime/Dockerfile.graphiti-luna-memory
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Existing authorized extraction credential required}
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-6-luna
      LLM_API_URL: https://api.openai.com/v1
    volumes:
      - ./config.luna-memory.yaml:/app/mcp/config/local.yaml:ro
